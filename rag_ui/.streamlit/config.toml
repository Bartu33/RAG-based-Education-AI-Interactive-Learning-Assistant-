# Light theme derived from the app logo (sapphire / indigo + a touch of gold).
# Component styling lives in assets/styles.css (loaded by core/styles.py).
# Fonts are self-hosted from rag_ui/static/fonts (SIL Open Font License 1.1): no request to Google,
# so the UI also works offline / in privacy mode; latin + latin-ext cover every Turkish letter.
[theme]
base = "light"
primaryColor = "#3451D1"            # sapphire-indigo (logo), 6.6:1 on white
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFFFFF"     # inputs stay white on the tinted page (styles.css --canvas)
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#3451D1"
borderColor = "#E2E8F0"
font = "Plus Jakarta Sans, sans-serif"
codeFont = "JetBrains Mono, monospace"
baseRadius = "10px"
showWidgetBorder = true

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 1024        # MB: lecture videos are large
enableStaticServing = true  # serves rag_ui/static (fonts) at app/static/

[[theme.fontFaces]]
family = "Plus Jakarta Sans"
url = "app/static/fonts/plus-jakarta-sans-latin-ext-400-normal.woff2"
weight = 400
style = "normal"
unicodeRange = "U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF"

